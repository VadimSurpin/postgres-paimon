# Quiet logging for the TPC-C comparison.
#
# The reader jar bundles hadoop's own log4j.properties (reload4j, via slf4j-reload4j), which logs
# at INFO and emits one line per Parquet decompressor from org.apache.hadoop.io.compress.CodecPool
# -- thousands of lines interleaved with the comparison's own output, in the one artifact a CI
# failure has to be diagnosed from. Passed as -Dlog4j.configuration=file:.../log4j.properties.
#
# WARN, not OFF: a real warning from Paimon or Hadoop during the read is something we want to see.
log4j.rootLogger=WARN, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %-5p %c{2} - %m%n
