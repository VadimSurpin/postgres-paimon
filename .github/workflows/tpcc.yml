name: TPC-C verification

# Runs a BenchBase TPC-C workload against PostgreSQL 18, replicates it through paimon_slot +
# paimon-writer, and then proves PostgreSQL and the Paimon warehouse hold the same state.
#
# workflow_dispatch ONLY, on purpose. It is a minutes-long job that builds BenchBase from source
# and writes a few hundred thousand rows; it must never fire on a push or a pull request.
#
# The job's verdict is the comparison (java/src/test/java/pro/surpin/pgpaimon/TpccCompare.java):
# it compares every column of every row of the eight replicated TPC-C tables, asserts the changelog
# carries a real -U before-image for every update, and asserts that `history` -- which has no
# primary key in TPC-C and therefore cannot be replicated by design -- is absent from the
# publication and from the warehouse. A difference fails the job.
#
# BenchBase is built UNMODIFIED: the TPC-C schema is exactly as it ships.
#
# No Docker: PostgreSQL 18 comes from PGDG and the extension is pure SQL. There is nothing to
# compile with PGXS here -- paimon_slot is a control file and a SQL script -- so no Arrow, AWS SDK
# or libhdfs3 build is needed.

on:
  workflow_dispatch:
    inputs:
      warehouses:
        description: "TPC-C scale factor, in warehouses"
        default: "1"
        type: string
      time:
        description: "execute phase duration (seconds)"
        default: "60"
        type: string
      rate:
        description: "execute phase ceiling (transactions per second)"
        # The writer makes one Paimon snapshot per replicated transaction, and both the drain and
        # the changelog scan are linear in that count, so this -- not the row count -- sets the
        # job's runtime. 60s at 25 tps is ~1500 transactions, which covers every update and delete
        # path TPC-C has.
        default: "25"
        type: string
      terminals:
        description: "concurrent BenchBase terminals"
        default: "1"
        type: string
      benchbase_ref:
        description: "BenchBase git tag or commit to build"
        default: "v2023"
        type: string

jobs:
  tpcc:
    name: TPC-C end to end (PG18 + paimon_slot + paimon-writer)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TPCC_WAREHOUSES: ${{ inputs.warehouses }}
      TPCC_TIME: ${{ inputs.time }}
      TPCC_RATE: ${{ inputs.rate }}
      TPCC_TERMINALS: ${{ inputs.terminals }}
      BENCHBASE_REF: ${{ inputs.benchbase_ref }}

    steps:
      - uses: actions/checkout@v4

      # $RUNNER_TEMP is a plain environment variable available in every step. The `runner`
      # expression context is NOT available in a job-level `env:` block, which is why this is
      # resolved here rather than beside the other TPCC_* variables above.
      - name: Resolve the run directory
        run: echo "TPCC_RUN_DIR=$RUNNER_TEMP/tpcc-run" >> "$GITHUB_ENV"

      # BenchBase v2023 targets Java 21 and the repository's own code targets 17. Install both:
      # setup-java exports JAVA_HOME_21_X64, which test/tpcc/run_tpcc.sh looks for, and the second
      # call leaves 17 as the default JAVA_HOME for the writer and the comparison.
      - name: Set up JDK 21 (BenchBase)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up JDK 17 (writer, comparison)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Install PostgreSQL 18
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18
          # The harness builds its own cluster on 5443 with initdb; the packaged one is in the way
          # of nothing, but stopping it frees the memory the workload wants.
          sudo pg_ctlcluster 18 main stop || true

      # ── the two jars under test ─────────────────────────────────────────────
      - name: Build the writer jar (runs its unit tests)
        working-directory: java/writer
        run: mvn -B -ntp package

      - name: Build the reader jar (carries TpccCompare)
        run: mvn -B -ntp -f java/pom.xml package -DskipTests

      # ── BenchBase ───────────────────────────────────────────────────────────
      # cmu-db/benchbase publishes no release artifact, so it has to be built from source
      # (~6 minutes cold). It is built UNMODIFIED, from a pinned tag: the TPC-C schema and loader
      # are exactly as they ship. Cache the built distribution so a repeat run skips both the clone
      # and the Maven build.
      - name: Cache the built BenchBase distribution
        id: cache-benchbase
        uses: actions/cache@v4
        with:
          path: ~/benchbase-dist
          key: benchbase-${{ inputs.benchbase_ref }}-stock-${{ runner.os }}

      - name: Build BenchBase (unmodified, from the pinned tag)
        if: steps.cache-benchbase.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/benchbase-src"
          git clone --quiet --depth 1 --branch "$BENCHBASE_REF" \
            https://github.com/cmu-db/benchbase.git "$SRC"
          JAVA_HOME="$JAVA_HOME_21_X64" mvn -B -ntp -f "$SRC/pom.xml" \
            clean package -P postgres -DskipTests
          mkdir -p "$HOME/benchbase-dist"
          tar -xzf "$SRC/target/benchbase-postgres.tgz" -C "$HOME/benchbase-dist"
          test -f "$HOME/benchbase-dist/benchbase-postgres/benchbase.jar"

      # ── the run: create -> add_table -> writer -> load -> execute -> compare ─
      - name: Run TPC-C and compare PostgreSQL against Paimon
        run: |
          # $HOME is not in the `env` expression context, so it is resolved here, in the shell.
          export BENCHBASE_HOME="$HOME/benchbase-dist/benchbase-postgres"
          ./test/tpcc/run_tpcc.sh

      # ── diagnostics, whatever the outcome ───────────────────────────────────
      # A CI failure you cannot diagnose is nearly useless, so these are collected on failure too.
      # Copied into the workspace first: the run directory is outside it, and the warehouse itself
      # is hundreds of megabytes of small files, so only a listing of it is kept.
      - name: Collect diagnostics
        if: always()
        run: |
          RUN="$TPCC_RUN_DIR"
          DEST="$GITHUB_WORKSPACE/tpcc-diagnostics"
          mkdir -p "$DEST"
          {
            echo "# Paimon warehouse: one database directory per PostgreSQL schema,"
            echo "# so a table lives at <warehouse>/<schema>.db/<table>."
            find "$RUN/warehouse" -maxdepth 2 -type d 2>/dev/null | sort
            echo
            echo "# per-table file count, size and snapshot count"
            echo "# (one snapshot per replicated PostgreSQL transaction)"
            for d in "$RUN"/warehouse/*.db/*; do
              [ -d "$d" ] || continue
              printf '%s  files=%s  size=%s  snapshots=%s\n' \
                "$d" \
                "$(find "$d" -type f | wc -l)" \
                "$(du -sh "$d" | cut -f1)" \
                "$(ls "$d/snapshot" 2>/dev/null | grep -c '^snapshot-' || true)"
            done
            echo
            echo "# full listing"
            find "$RUN/warehouse" 2>/dev/null | sort
          } > "$DEST/warehouse-listing.txt"
          for f in writer.log compare.out tpcc.xml pg.log \
                   benchbase-create.log benchbase-load.log benchbase-execute.log \
                   benchbase-build.log; do
            [ -f "$RUN/$f" ] && cp "$RUN/$f" "$DEST/" || true
          done
          [ -d "$RUN/benchbase-results" ] && cp -r "$RUN/benchbase-results" "$DEST/" || true
          ls -la "$DEST"
          head -40 "$DEST/warehouse-listing.txt"

      - name: Upload the writer log, comparison output and warehouse listing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpcc-diagnostics
          path: tpcc-diagnostics
          retention-days: 14
          if-no-files-found: warn

      - name: Summarise the comparison
        if: always()
        run: |
          {
            echo "## TPC-C verification"
            echo
            echo "BenchBase \`${BENCHBASE_REF}\`, ${TPCC_WAREHOUSES} warehouse(s),"
            echo "${TPCC_TIME}s execute at up to ${TPCC_RATE} tps, ${TPCC_TERMINALS} terminal(s)."
            echo
            echo '```'
            sed -n '/^Summary/,$p' "$TPCC_RUN_DIR/compare.out" 2>/dev/null \
              || echo "(no comparison output: the run failed before the comparison)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
