name: Paimon compatibility tests

# Builds all Java compatibility-test and utility jars.
# These are NOT release artifacts — they are standalone tools for verifying
# that paimon_heap output is readable by the Apache Paimon Java API and for
# running integration tests against a live PostgreSQL instance.

on:
  push:
    branches: ["main", "master"]
    paths:
      - "java/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java.yml"

jobs:
  build:
    name: Build all Maven profiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build reader jar (PaimonRead)
        working-directory: java
        run: mvn -B package --no-transfer-progress

      - name: Build feature-test jar
        working-directory: java
        run: mvn -B package -P feature-test --no-transfer-progress

      - name: Build ddl-test jar
        working-directory: java
        run: mvn -B package -P ddl-test --no-transfer-progress

      - name: Build type-test jar
        working-directory: java
        run: mvn -B package -P type-test --no-transfer-progress

      - name: Build advanced-test jar
        working-directory: java
        run: mvn -B package -P advanced-test --no-transfer-progress

      - name: Build offload-test jar
        working-directory: java
        run: mvn -B package -P offload-test --no-transfer-progress

      - name: Build e2e-test jar
        working-directory: java
        run: mvn -B package -P e2e-test --no-transfer-progress

      - name: Build compaction jar
        working-directory: java
        run: mvn -B package -P compaction --no-transfer-progress

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: paimon-compatibility-jars
          path: java/target/*.jar
          retention-days: 7
