name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '27 6 * * 1'  # Weekly — Monday 06:27 UTC

jobs:
  # ── Java / Kotlin ────────────────────────────────────────────────────────────
  analyze-java:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none   # CodeQL reads .class bytecode; no build needed

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: java

  # ── C++ ─────────────────────────────────────────────────────────────────────
  analyze-cpp:
    name: Analyze C++
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Install system packages — mirrors the Dockerfile base layer.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            bison flex \
            libreadline-dev zlib1g-dev libssl-dev libxml2-dev \
            apt-transport-https gnupg lsb-release wget \
            libcurl4-openssl-dev uuid-dev \
            libkrb5-dev libsasl2-dev libgsasl-dev libprotobuf-dev protobuf-compiler \
            postgresql-server-dev-16

      # Apache Arrow from the official apt repo (same pin as Dockerfile).
      - name: Install Apache Arrow
        run: |
          wget -q "https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release -cs).deb" \
               -O /tmp/arrow.deb
          sudo apt-get install -y /tmp/arrow.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarrow-dev=18.1.0-1 libparquet-dev=18.1.0-1

      # AWS SDK for C++ — must clone with submodules (tarball omits aws-crt-cpp).
      - name: Build AWS SDK for C++
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            --branch 1.11.360 \
            https://github.com/aws/aws-sdk-cpp.git /tmp/aws-sdk-cpp
          cmake -S /tmp/aws-sdk-cpp -B /tmp/aws-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/aws-sdk-cpp \
            -DBUILD_ONLY="s3;core" \
            -DENABLE_TESTING=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DAUTORUN_UNIT_TESTS=OFF
          sudo cmake --build /tmp/aws-build --parallel "$(nproc)"
          sudo cmake --install /tmp/aws-build

      # libhdfs3 from HAWQ — same patches as Dockerfile for GCC 13 / Ubuntu 24.04.
      - name: Build libhdfs3
        run: |
          git clone --depth=1 https://github.com/apache/hawq /tmp/hawq
          sed -i 's/-dumpversion/-dumpfullversion/' \
              /tmp/hawq/depends/libhdfs3/CMake/Platform.cmake
          sed -i 's/FIND_PACKAGE(GoogleTest REQUIRED)/FIND_PACKAGE(GoogleTest)/' \
              /tmp/hawq/depends/libhdfs3/CMakeLists.txt
          sed -i '/[Aa][Dd][Dd]_\?[Ss][Uu][Bb][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy].*test/Id' \
              /tmp/hawq/depends/libhdfs3/CMakeLists.txt
          cmake -S /tmp/hawq/depends/thirdparty/googletest \
                -B /tmp/gtest-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_GMOCK=ON \
                -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/gtest-build
          sudo cmake --install /tmp/gtest-build
          cmake -S /tmp/hawq/depends/libhdfs3 -B /tmp/hdfs3-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_CXX_FLAGS="-include cstdint -include sys/types.h" \
            -DGtest_LIBRARY=/usr/local/lib/libgtest.a \
            -DGmock_LIBRARY=/usr/local/lib/libgmock.a \
            -DGtest_INCLUDE_DIR=/usr/local/include \
            -DGmock_INCLUDE_DIR=/usr/local/include
          sudo cmake --build /tmp/hdfs3-build --parallel "$(nproc)"
          sudo cmake --install /tmp/hdfs3-build
          sudo ldconfig

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual

      # PG16 pg_config provides standard PGXS — close enough to PG19 for analysis.
      - name: Build extension for CodeQL tracing
        working-directory: extension
        run: |
          make -j"$(nproc)" \
            PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config \
            AWS_SDK_ROOT=/opt/aws-sdk-cpp \
            HDFS3_ROOT=/usr/local \
            ARROW_INC=/usr/include/arrow
        continue-on-error: true  # Partial trace is still useful

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: cpp
