name: paimon-heap-demo

services:

  # ── MinIO (S3-compatible object store) ────────────────────────────────────
  minio:
    image: minio/minio
    hostname: minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER:     testuser
      MINIO_ROOT_PASSWORD: testkey123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      retries: 12
      start_period: 10s

  # ── One-shot: create the paimon-warehouse bucket ──────────────────────────
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set demo http://minio:9000 testuser testkey123 &&
      mc mb demo/paimon-warehouse --ignore-existing &&
      echo 'bucket ready'
      "
    restart: "no"

  # ── PostgreSQL 18 + paimon_heap ────────────────────────────────────────────
  postgres:
    build:
      context: ../..
      dockerfile: docker/demo/postgres/Dockerfile
    hostname: postgres
    environment:
      AWS_ACCESS_KEY_ID:     testuser
      AWS_SECRET_ACCESS_KEY: testkey123
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - pg-data:/var/lib/postgresql
      - ./postgres/init.sql:/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U demo -d demo"]
      interval: 5s
      retries: 20
      start_period: 30s

  # ── Spark reader (run with: podman compose run --rm spark) ────────────────
  spark:
    build:
      context: ../..
      dockerfile: docker/demo/spark/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - spark

volumes:
  minio-data:
  pg-data:
